name: Connector request
description: Ask for a new source (Outlook, Telegram, Discord…) or offer to build one.
labels: [connector]
body:
  - type: input
    id: source
    attributes:
      label: Source
      placeholder: Outlook
    validations:
      required: true
  - type: textarea
    id: access
    attributes:
      label: How could Claude reach it?
      description: An MCP server (link it if you know one), an HTTP API, or a website in Chrome.
  - type: textarea
    id: use
    attributes:
      label: What kind of requests arrive there?
      description: This helps decide what the connector should read and how replies should work.
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I'd like to build this connector myself
